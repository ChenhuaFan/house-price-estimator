server:
  port: 8080
  shutdown: graceful

spring:
  application:
    name: market-service
  datasource:
    url: ${MARKET_DATABASE_URL:jdbc:postgresql://localhost:5432/housing}
    username: ${MARKET_DATABASE_USER:market_runtime}
    password: ${MARKET_DATABASE_PASSWORD:market}
    hikari:
      maximum-pool-size: 8
      connection-timeout: 2000
      validation-timeout: 1000
  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=500,expireAfterWrite=5m,recordStats
  mvc:
    problemdetails:
      enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
        liveness:
          include: livenessState
  metrics:
    tags:
      service: market-service

springdoc:
  api-docs:
    version: openapi_3_1

model-service:
  url: ${MODEL_SERVICE_URL:http://localhost:8000}
  connect-timeout: ${MODEL_CONNECT_TIMEOUT:1s}
  response-timeout: ${MODEL_RESPONSE_TIMEOUT:3s}

portal:
  origin: ${PORTAL_ORIGIN:http://localhost:3000}
